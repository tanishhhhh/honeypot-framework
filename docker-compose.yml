services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"   # Exposed to host for native Vite frontend (localhost:5173)
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env          # Injects SMTP, SIEM, and all user-defined variables into container
    environment:
      - LOG_PATH=/app/logs/logs.csv
      - FLASK_DEBUG=false
      - DB_URL=postgresql://admin:admin123@db:5432/honeypot
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # NOTE: React frontend runs natively via Vite on port 5173 (outside Docker).
  # See Dockerfile.frontend for legacy Nginx production build instructions.

  cowrie-live:
    image: cowrie/cowrie:latest
    container_name: cowrie-live
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - ./honeypots/cowrie/logs:/cowrie/log
      - ./honeypots/cowrie/config:/cowrie/cowrie.cfg.d
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep 2222 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    container_name: honeypot-live
    environment:
      POSTGRES_DB: honeypot
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d honeypot"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
