services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    environment:
      - LOG_PATH=/app/logs/logs.csv
      - FLASK_DEBUG=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:5000/predict
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
